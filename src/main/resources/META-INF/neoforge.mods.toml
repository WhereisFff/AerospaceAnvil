modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/WhereisFff/AerospaceAnvil/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/WhereisFff/AerospaceAnvil"
authors = "WhereisFff"
description = '''航空级铁砧，为铁砧工艺与 Sable 动态结构提供磁铁和下落方块兼容。'''

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "anvilcraft"
type = "required"
versionRange = "[1.6.0,1.7)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "[2.0.6,2.1)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "aerospace_anvil.mixins.json"
