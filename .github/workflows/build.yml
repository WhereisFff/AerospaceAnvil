name: 构建与测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建与静态检查
        run: bash gradlew build --console=plain
      - name: 服务端游戏测试
        run: bash gradlew runGameTestServer --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: aerospace-anvil-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
